[package]
name = "lua51-bytecode"
description = "Strict, panic-free reader for Lua 5.1 precompiled bytecode (luac output, either byte order), with a lister of calls made with constant arguments"
keywords = ["lua", "bytecode", "luac", "disassembler", "parser"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/lua51-bytecode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/lua51-bytecode"
publish = true

[workspace.dependencies]
primase-foundations = { version = "0.2.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "b3a3d4b3a892b8342fda081ab4449bb57052a2f8" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
